server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API requests go to the ASP.NET Core container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (e.g. /books) serve index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
